name: Godot tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Unit tests
            script: addons/callboard/tests/unit.gd
          - name: Callboard smoke test
            script: addons/callboard/tests/editor_smoke.gd
          - name: Demo editor smoke test
            script: demo/tests/editor_smoke.gd
          - name: Demo runtime smoke test
            script: demo/tests/smoke.gd
    env:
      GODOT_VERSION: 4.7.2-stable
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Godot
        run: |
          binary="Godot_v${GODOT_VERSION}_linux.x86_64"
          release_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl --fail --silent --show-error --location --retry 3 \
            "$release_url/$binary.zip" --output "$RUNNER_TEMP/$binary.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "$release_url/SHA512-SUMS.txt" --output "$RUNNER_TEMP/SHA512-SUMS.txt"
          (
            cd "$RUNNER_TEMP"
            awk -v archive="$binary.zip" '$2 == archive || $2 == ("*" archive)' SHA512-SUMS.txt |
              sha512sum --check --strict
          )
          unzip -q "$RUNNER_TEMP/$binary.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/$binary" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E '^(SCRIPT )?ERROR:' "$RUNNER_TEMP/godot-import.log"; then
            exit 1
          fi

      - name: Run suite
        env:
          TEST_SCRIPT: ${{ matrix.suite.script }}
        run: |
          set -o pipefail
          timeout 120s godot --headless --path . --script "res://$TEST_SCRIPT" 2>&1 | tee "$RUNNER_TEMP/godot-suite.log"
          if grep -F 'SCRIPT ERROR' "$RUNNER_TEMP/godot-suite.log"; then
            exit 1
          fi

      - name: Verify runtime excludes editor and model layers
        if: matrix.suite.script == 'demo/tests/smoke.gd'
        run: |
          temp_project="$RUNNER_TEMP/callboard-runtime-check"
          mkdir -p "$temp_project/addons/callboard" "$temp_project/demo/tests"
          cp -R addons/callboard/core "$temp_project/addons/callboard/"
          cp project.godot "$temp_project/"
          cp -R demo/game.tscn demo/scripts demo/stages "$temp_project/demo/"
          cp demo/tests/smoke.gd demo/tests/smoke.gd.uid "$temp_project/demo/tests/"
          python3 - "$temp_project/project.godot" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          kept = []
          skip = False
          for line in lines:
              if line.startswith("["):
                  skip = line == "[editor_plugins]"
              if not skip:
                  kept.append(line)
          path.write_text("\n".join(kept) + "\n")
          PY
          set -o pipefail
          timeout 120s godot --headless --path "$temp_project" --editor --import 2>&1 | tee "$RUNNER_TEMP/godot-runtime-import.log"
          if grep -E '^(SCRIPT )?ERROR:' "$RUNNER_TEMP/godot-runtime-import.log"; then
            exit 1
          fi
          timeout 120s godot --headless --path "$temp_project" --script res://demo/tests/smoke.gd 2>&1 | tee "$RUNNER_TEMP/godot-runtime-boundary.log"
          if grep -E '^(SCRIPT )?ERROR:' "$RUNNER_TEMP/godot-runtime-boundary.log"; then
            exit 1
          fi
          timeout 120s godot --headless --path "$temp_project" --quit-after 5 2>&1 | tee "$RUNNER_TEMP/godot-runtime-exit.log"
          if grep -E '^(SCRIPT )?ERROR:|ObjectDB instances were leaked' "$RUNNER_TEMP/godot-runtime-exit.log"; then
            exit 1
          fi

  package:
    name: Package Callboard
    needs: headless
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build versioned addon ZIP
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          args=(dist "$created_at")
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--pr "$PR_NUMBER")
          fi
          version="$(python3 .github/scripts/package_addon.py "${args[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload installable ZIP
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: dist/callboard-${{ steps.build.outputs.version }}.zip
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Link the download in the run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          VERSION: ${{ steps.build.outputs.version }}
        run: printf 'Download [Callboard %s](%s)\n' "$VERSION" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub release
    needs: package
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the tested package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: dist
          skip-decompress: true

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="v$VERSION"
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$existing_tag" ]]; then
            tagged_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Version $VERSION already tags a different commit."
              exit 1
            fi
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" "dist/callboard-$VERSION.zip" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Callboard $VERSION" --generate-notes --latest
          fi
