name: Godot tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Unit tests
            script: unit.gd
          - name: Callboard smoke test
            script: editor_smoke.gd
          - name: Runtime smoke test
            script: smoke.gd
    env:
      GODOT_VERSION: 4.7.2-stable
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Godot
        run: |
          binary="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${binary}.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/$binary" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: |
          godot --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E '^(SCRIPT )?ERROR:' "$RUNNER_TEMP/godot-import.log"; then
            exit 1
          fi

      - name: Run suite
        env:
          TEST_SCRIPT: ${{ matrix.suite.script }}
        run: |
          set -o pipefail
          timeout 120s godot --headless --path . --script "res://tests/$TEST_SCRIPT" 2>&1 | tee "$RUNNER_TEMP/godot-suite.log"
          if grep -F 'SCRIPT ERROR' "$RUNNER_TEMP/godot-suite.log"; then
            exit 1
          fi

      - name: Verify runtime excludes editor and model layers
        if: matrix.suite.script == 'smoke.gd'
        run: |
          temp_project="$RUNNER_TEMP/callboard-runtime-check"
          mkdir -p "$temp_project/addons/callboard" "$temp_project/tests"
          cp -R addons/callboard/core "$temp_project/addons/callboard/"
          cp -R scripts stages game.tscn project.godot "$temp_project/"
          cp tests/smoke.gd tests/smoke.gd.uid "$temp_project/tests/"
          python3 - "$temp_project/project.godot" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          kept = []
          skip = False
          for line in lines:
              if line.startswith("["):
                  skip = line == "[editor_plugins]"
              if not skip:
                  kept.append(line)
          path.write_text("\n".join(kept) + "\n")
          PY
          set -o pipefail
          timeout 120s godot --headless --path "$temp_project" --editor --import 2>&1 | tee "$RUNNER_TEMP/godot-runtime-import.log"
          if grep -E '^(SCRIPT )?ERROR:' "$RUNNER_TEMP/godot-runtime-import.log"; then
            exit 1
          fi
          timeout 120s godot --headless --path "$temp_project" --script res://tests/smoke.gd 2>&1 | tee "$RUNNER_TEMP/godot-runtime-boundary.log"
          if grep -F 'SCRIPT ERROR' "$RUNNER_TEMP/godot-runtime-boundary.log"; then
            exit 1
          fi
